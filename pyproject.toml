[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "idiomchain"
version = "0.1.0"
description = "成语接龙：词库查询、接龙生成与可打印练习纸"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["education", "chinese", "idiom", "worksheet", "printable", "game"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]
dependencies = []

[project.scripts]
idiomchain = "idiomchain.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/idiomchain"
Source = "https://github.com/eastyou/idiomchain"

[tool.setuptools]
packages = ["idiomchain"]
